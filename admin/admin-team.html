<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      var t = localStorage.getItem('zeal-admin-theme') || 'dark-theme';
      document.documentElement.className = t;
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Team — ZEAL Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="dark-theme">
<div class="admin-shell">

  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="admin-dashboard.html" class="brand-title">ZEAL</a>
      <div class="brand-sub">Admin Panel</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="admin-dashboard.html" class="sidebar-link"><span class="nav-icon"><i class="fa-solid fa-gauge-high"></i></span>Dashboard</a>
      <a href="admin-home.html"      class="sidebar-link"><span class="nav-icon"><i class="fa-solid fa-house"></i></span>Home</a>
      <div class="nav-section-label">Content</div>
      <a href="admin-events.html"        class="sidebar-link"><span class="nav-icon"><i class="fa-solid fa-calendar-star"></i></span>Events</a>
      <a href="admin-team.html"          class="sidebar-link active"><span class="nav-icon"><i class="fa-solid fa-users"></i></span>Our Team</a>
      <a href="admin-sponsors.html"      class="sidebar-link"><span class="nav-icon"><i class="fa-solid fa-handshake"></i></span>Sponsors</a>
      <a href="admin-announcements.html" class="sidebar-link"><span class="nav-icon"><i class="fa-solid fa-bullhorn"></i></span>Announcements</a>
      <a href="admin-footer.html"        class="sidebar-link"><span class="nav-icon"><i class="fa-solid fa-shoe-prints"></i></span>Footer</a>
    </nav>
    <div class="sidebar-footer"><small>ZEAL Admin v1.0</small></div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="topbar-toggle"><i class="fa-solid fa-bars"></i></button>
      <span class="topbar-title">Our Team</span>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="btn-gold" onclick="openAddSectionModal()">
          <i class="fa-solid fa-plus"></i> Add Section
        </button>
        <button class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
          <span class="t-icon-sun">&#9728;</span><span class="t-icon-moon">&#9790;</span>
        </button>
        <button class="topbar-btn" onclick="Auth.logout()" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        <div class="topbar-avatar">A</div>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-header">
        <h1>Our Team</h1>
        <p>Manage team sections and member profiles.</p>
        <div class="gold-line"></div>
      </div>
      <div id="team-sections-container">
        <div class="text-center py-5" style="color:var(--text-muted)">
          <i class="fa-solid fa-spinner fa-spin fa-2x mb-3"></i><br>Loading sections…
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ── Add / Edit Section Modal ──────────────────────────── -->
<div class="modal fade" id="sectionModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="sectionModalTitle">Add Section</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="section-edit-id" value="" />
        <div class="mb-3">
          <label class="form-label">Section Title *</label>
          <input class="form-control" id="section-title" placeholder="e.g. Conveners, Coordinators…" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-gold" id="save-section-btn" onclick="saveSection()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Add / Edit Member Modal ───────────────────────── -->
<div class="modal fade" id="memberModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="memberModalTitle">Add Member</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="member-section-id" value="" />
        <input type="hidden" id="member-edit-id"    value="" />
        <div class="row g-3">
          <div class="col-12 d-flex gap-3 align-items-center mb-1">
            <img id="member-avatar-preview"
              src="https://ui-avatars.com/api/?name=Member&background=D4AF37&color=000&size=80"
              style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold-border)" />
            <div>
              <label class="form-label mb-1">Profile Photo</label>
              <input type="file" class="form-control" id="member-image" accept="image/*" />
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Name *</label>
            <input class="form-control" id="member-name" placeholder="Full name" />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Designation *</label>
            <input class="form-control" id="member-designation" placeholder="e.g. Event Head" />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Phone Number</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
              <input class="form-control" id="member-phone" placeholder="+91 XXXXX XXXXX" />
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Instagram Handle</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-brands fa-instagram"></i></span>
              <input class="form-control" id="member-instagram" placeholder="username (no @)" />
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-gold" id="save-member-btn" onclick="saveMember()"><i class="fa-solid fa-floppy-disk"></i> Save Member</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="js/admin.js"></script>
<script src="js/api.js"></script>
<script>
Auth.guardPage();

let teamSections = [];

// ── Load from API ──────────────────────────────────────────
async function loadTeam() {
  try {
    teamSections = await TeamAPI.getAll();
    renderAllSections();
  } catch (err) {
    console.error(err);
    Toast.show('Failed to load team data: ' + err.message, 'error');
    document.getElementById('team-sections-container').innerHTML =
      `<div class="empty-state admin-card"><i class="fa-solid fa-triangle-exclamation"></i><p>Could not load team data.</p></div>`;
  }
}

// ── Render All Sections ────────────────────────────────────
function renderAllSections() {
  const container = document.getElementById('team-sections-container');

  if (!teamSections.length) {
    container.innerHTML = `
      <div class="empty-state admin-card">
        <i class="fa-solid fa-users"></i>
        <p>No team sections yet.<br>Click "Add Section" to create the first one.</p>
      </div>`;
    return;
  }

  container.innerHTML = teamSections.map(sec => `
    <div class="team-section-block">
      <div class="team-section-head">
        <h3><i class="fa-solid fa-layer-group me-2"></i>${sec.sectionName}</h3>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-size:12px;color:var(--text-muted)">${sec.members.length} member${sec.members.length !== 1 ? 's' : ''}</span>
          <button class="btn-add-sm"    onclick="openAddMemberModal('${sec._id}')"><i class="fa-solid fa-plus"></i> Add Member</button>
          <button class="btn-edit-sm"   onclick="openEditSectionModal('${sec._id}')"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-danger-sm" onclick="deleteSection('${sec._id}', '${sec.sectionName.replace(/'/g,"\\'")}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
      <div class="team-section-body">
        ${sec.members.length === 0
          ? `<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:16px">No members in this section yet.</div>`
          : sec.members.map(m => `
            <div class="member-card">
              <img class="member-avatar"
                src="${m.image ? ('http://localhost:5000' + m.image) : `https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=D4AF37&color=000&size=60`}"
                alt="${m.name}" />
              <div class="member-info">
                <strong>${m.name}</strong>
                <span>${m.designation}</span>
                ${m.phone    ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px"><i class="fa-solid fa-phone" style="width:12px"></i> ${m.phone}</div>` : ''}
                ${m.instagram ? `<div style="font-size:11px;color:var(--text-muted)"><i class="fa-brands fa-instagram" style="width:12px"></i> @${m.instagram}</div>` : ''}
              </div>
              <div class="member-actions">
                <button class="btn-edit-sm"   onclick="openEditMemberModal('${sec._id}','${m._id}')"><i class="fa-solid fa-pen"></i></button>
                <button class="btn-danger-sm" onclick="deleteMember('${sec._id}','${m._id}','${m.name.replace(/'/g,"\\'")}')"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>`).join('')}
      </div>
    </div>`).join('');
}

// ── Section: Add ──────────────────────────────────────────
function openAddSectionModal() {
  document.getElementById('sectionModalTitle').textContent = 'Add Section';
  document.getElementById('section-edit-id').value = '';
  document.getElementById('section-title').value   = '';
  openModal('sectionModal');
}

// ── Section: Edit ─────────────────────────────────────────
function openEditSectionModal(id) {
  const sec = teamSections.find(s => s._id === id);
  if (!sec) return;
  document.getElementById('sectionModalTitle').textContent = 'Edit Section';
  document.getElementById('section-edit-id').value = sec._id;
  document.getElementById('section-title').value   = sec.sectionName;
  openModal('sectionModal');
}

// ── Section: Save (Create only — backend has no update section endpoint, so we handle gracefully) ──
async function saveSection() {
  const title  = document.getElementById('section-title').value.trim();
  const editId = document.getElementById('section-edit-id').value;
  if (!title) { Toast.show('Section title is required.', 'error'); return; }

  const btn = document.getElementById('save-section-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';

  try {
    if (editId) {
      // No backend update-section endpoint exists; update locally for display
      // and re-render. A full rename would require a backend endpoint.
      const sec = teamSections.find(s => s._id === editId);
      if (sec) sec.sectionName = title;
      renderAllSections();
      Toast.show('Section name updated (local). Refresh to revert.', 'info');
    } else {
      await TeamAPI.createSection(title);
      Toast.show('Section created!', 'success');
      await loadTeam();
    }
    closeModal('sectionModal');
  } catch (err) {
    Toast.show('Save failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save';
  }
}

// ── Section: Delete ───────────────────────────────────────
async function deleteSection(id, name) {
  confirmDelete(`Delete section "${name}" and all its members?`, async () => {
    try {
      await TeamAPI.deleteSection(id);
      Toast.show('Section deleted.', 'success');
      await loadTeam();
    } catch (err) {
      Toast.show('Delete failed: ' + err.message, 'error');
    }
  });
}

// ── Member: Add ───────────────────────────────────────────
function openAddMemberModal(sectionId) {
  document.getElementById('memberModalTitle').textContent = 'Add Member';
  document.getElementById('member-section-id').value = sectionId;
  document.getElementById('member-edit-id').value    = '';
  document.getElementById('member-name').value        = '';
  document.getElementById('member-designation').value = '';
  document.getElementById('member-phone').value       = '';
  document.getElementById('member-instagram').value   = '';
  document.getElementById('member-image').value       = '';
  document.getElementById('member-avatar-preview').src =
    'https://ui-avatars.com/api/?name=Member&background=D4AF37&color=000&size=80';
  openModal('memberModal');
}

// ── Member: Edit ──────────────────────────────────────────
function openEditMemberModal(sectionId, memberId) {
  const sec = teamSections.find(s => s._id === sectionId);
  const m   = sec && sec.members.find(m => m._id === memberId);
  if (!m) return;

  document.getElementById('memberModalTitle').textContent  = 'Edit Member';
  document.getElementById('member-section-id').value  = sectionId;
  document.getElementById('member-edit-id').value     = memberId;
  document.getElementById('member-name').value         = m.name;
  document.getElementById('member-designation').value  = m.designation;
  document.getElementById('member-phone').value        = m.phone || '';
  document.getElementById('member-instagram').value    = m.instagram || '';
  document.getElementById('member-image').value        = '';
  document.getElementById('member-avatar-preview').src =
    m.image
      ? 'http://localhost:5000' + m.image
      : `https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=D4AF37&color=000&size=80`;
  openModal('memberModal');
}

// ── Member: Save ──────────────────────────────────────────
async function saveMember() {
  const name        = document.getElementById('member-name').value.trim();
  const designation = document.getElementById('member-designation').value.trim();
  const phone       = document.getElementById('member-phone').value.trim();
  const instagram   = document.getElementById('member-instagram').value.trim();
  const sectionId   = document.getElementById('member-section-id').value;
  const editId      = document.getElementById('member-edit-id').value;
  const imageFile   = document.getElementById('member-image').files[0];

  if (!name || !designation) {
    Toast.show('Name and Designation are required.', 'error'); return;
  }

  const formData = new FormData();
  formData.append('name', name);
  formData.append('designation', designation);
  if (phone)     formData.append('phone', phone);
  if (instagram) formData.append('instagram', instagram);
  if (imageFile) formData.append('image', imageFile);

  const btn = document.getElementById('save-member-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';

  try {
    if (editId) {
      await TeamAPI.updateMember(sectionId, editId, formData);
      Toast.show('Member updated!', 'success');
    } else {
      await TeamAPI.addMember(sectionId, formData);
      Toast.show('Member added!', 'success');
    }
    closeModal('memberModal');
    await loadTeam();
  } catch (err) {
    Toast.show('Save failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Member';
  }
}

// ── Member: Delete ────────────────────────────────────────
async function deleteMember(sectionId, memberId, name) {
  confirmDelete(`Remove ${name}?`, async () => {
    try {
      await TeamAPI.deleteMember(sectionId, memberId);
      Toast.show('Member removed.', 'success');
      await loadTeam();
    } catch (err) {
      Toast.show('Delete failed: ' + err.message, 'error');
    }
  });
}

// ── Avatar preview on file select ─────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadTeam();
  document.getElementById('member-image').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('member-avatar-preview').src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
});
</script>
</body>
</html>
